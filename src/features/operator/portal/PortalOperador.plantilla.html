<div class="operator-portal-page">
  <Teleport to="#operator-notification-anchor"><PortalOperadorAlertas /></Teleport>
  <div
    v-if="operatorRouteSectionLoadingVisible"
    class="operator-route-loading-overlay"
    role="status"
    aria-live="polite"
    :aria-label="operatorRouteSectionLoadingMeta.title"
  >
    <div class="operator-route-loading-shell">
      <div class="operator-route-loading-spinner" aria-hidden="true">
        <span v-for="segment in 12" :key="`operator-route-loading-segment-${segment}`"></span>
      </div>
      <p class="eyebrow">{{ operatorRouteSectionLoadingMeta.eyebrow }}</p>
      <h2>{{ operatorRouteSectionLoadingMeta.title }}</h2>
      <p class="muted">{{ operatorRouteSectionLoadingMeta.detail }}</p>
    </div>
  </div>

  <PortalOperadorDashboardSection v-if="section === 'dashboard'" />
  <PortalOperadorEmpresaSection v-else-if="section === 'empresa'" />
  <PortalOperadorAeronavesSection v-else-if="section === 'aeronaves'" />
  <PortalOperadorCostosSection v-else-if="section === 'costos'" />
  <PortalOperadorDisponibilidadSection v-else-if="section === 'disponibilidad'" />
  <PortalOperadorBloqueoOperativoSection
    v-else-if="currentOperationalBlockNotice && isOperationalSection(section)"
  />
  <PortalOperadorSolicitudesSection v-else-if="section === 'solicitudes'" />
  <PortalOperadorReleaseProviderSection v-else-if="section === 'release-provider'" />
  <PortalOperadorOperacionesSection v-else-if="section === 'operaciones'" />
  <PortalOperadorTripulacionSection v-else-if="section === 'tripulacion'" />
  <PortalOperadorIncidenciasSection v-else-if="section === 'incidencias'" />
  <PortalOperadorPagosSection v-else-if="section === 'pagos'" />
  <PortalOperadorHistorialSection v-else-if="section === 'historial'" />
  <PortalOperadorConfiguracionSection v-else />
</div>
